            border-radius: 4px;
            background: #222;
            color: #fff;
        }

        .sc-day.sat {
            color: #8ecae6;
        }

        /* Saturday color */
        .sc-day.fri {
            color: #ffb703;
        }

        /* Friday color */
        .sc-day.sun {
            color: #e60012;
        }

        .sc-day.mon {
            color: #fff;
        }

        .sc-day.tue {
            color: #fff;
        }

        .sc-day.wed {
            color: #fff;
        }

        .sc-day.thu {
            color: #fff;
        }

        .schedule-note {
            margin-top: 1.5rem;
            font-size: 1rem;
            /* Validated */
            color: #bbb;
            border-top: 1px dashed #444;
            padding-top: 1rem;
        }

        .text-section .schedule-note {
            text-align: center;
        }

        /* =========================================
           HORIZONTAL PHOTO GALLERY
           ========================================= */
        .photo-gallery-wrapper {
            margin-top: 1rem;
            position: relative;
        }

        .horizontal-scroll-container {
            display: flex;
            overflow-x: auto;
            gap: 16px;
            padding: 10px 5px 20px 5px;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
            scrollbar-color: var(--victory-gold) #333;
        }

        .horizontal-scroll-container::-webkit-scrollbar {
            height: 6px;
        }

        .horizontal-scroll-container::-webkit-scrollbar-track {
            background: #222;
        }

        .horizontal-scroll-container::-webkit-scrollbar-thumb {
            background: var(--victory-gold);
            border-radius: 3px;
        }

        .photo-card {
            flex: 0 0 280px;
            /* PC width */
            aspect-ratio: 1/1;
            /* Force Square */
            border-radius: 6px;
            overflow: hidden;
            scroll-snap-align: center;
            border: 2px solid #444;
            position: relative;
            background: #000;
            transition: 0.3s;
        }

        @media (max-width: 600px) {
            .photo-card {
                flex: 0 0 220px;
                /* Mobile width: Smaller to encourage scroll */
                scroll-snap-align: center;
            }
        }

        .photo-card:hover {
            border-color: var(--victory-gold);
            transform: scale(1.02);
        }

        .photo-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .gallery-scroll-hint {
            text-align: right;
            font-size: 0.8rem;
            color: var(--victory-gold);
            font-family: 'Audiowide';
            margin-bottom: 0.5rem;
            animation: blink 2s infinite;
        }

        @keyframes blink {
            50% {
                opacity: 0.5;
            }
        }

        /* System Table Styles */
        .system-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
            color: #fff;
            font-size: 1.1rem;
            /* Explicit increase */
            table-layout: fixed;
            /* Fix cell widths */
        }

        .system-table th,
        .system-table td {
            border-bottom: 1px solid #555;
            padding: 14px 10px;
            text-align: left;
            vertical-align: top;
            word-wrap: break-word;
            /* Prevent long word overflow */
        }

        .system-table th {
            color: var(--victory-gold);
            font-family: 'Audiowide';
            width: 35%;
            font-weight: normal;
            letter-spacing: 1px;
        }

        .system-table td {
            color: #fff;
            /* Ensure text is visible */
        }

        .system-note {
            font-size: 1rem;
            /* Validated */
            color: #ccc;
            margin-top: 1.5rem;
            border-top: 1px dashed #555;
            padding-top: 1rem;
            line-height: 1.6;
        }

        /* FAQ Styles */
        .faq-container {
            margin-top: 2rem;
            border-top: 1px dashed #555;
            padding-top: 1.5rem;
            text-align: left;
        }

        .faq-title {
            color: var(--victory-gold);
            font-family: 'Audiowide';
            margin-bottom: 1rem;
            font-size: 1.3rem;
            /* Increased size */

            align-items: center;
            gap: 10px;
        }

        .faq-item {
            margin-bottom: 1.5rem;
        }

        .faq-q {
            color: #fff;
            font-weight: bold;
            margin-bottom: 0.5rem;
            font-size: 1.1rem;
            /* Increased size */
        }

        .faq-q::before {
            content: "Q.";

            margin-right: 8px;
            font-family: 'Audiowide';
        }

        .faq-a {
            color: #ccc;
            padding-left: 1rem;
            border-left: 2px solid var(--fire-red);
            font-size: 1rem;
            /* Validated */
            line-height: 1.6;
        }

        /* Recommend List Styles */
        .recommend-list {
            list-style: none;
            padding: 0;
            margin: 1rem 0;
            text-align: left;
        }

        .recommend-list li {
            margin-bottom: 1rem;
            font-size: 1.1rem;
            /* Increased size */
            color: #fff;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 0.5rem;
        }

        .recommend-list li:last-child {
            border-bottom: none;
        }

        .recommend-list li i {
            color: var(--victory-gold);
            margin-top: 4px;
            font-size: 1.2rem;
            filter: drop-shadow(0 0 3px var(--fighter-orange));
        }

        .recommend-message {
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px dashed #555;
            font-weight: 500;
            color: #ddd;
            font-size: 1rem;
            /* Validated */
        }

        /* =========================================
           SPLIT SECTION WRAPPER (JOIN & RULES)
           ========================================= */
        .split-section-wrapper {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
            margin: 6rem 0;
            /* Increased margin */
        }

        @media (min-width: 900px) {

            /* PC - Side by Side */
            .split-section-wrapper {
                grid-template-columns: 1fr 1fr;
                align-items: start;
            }
        }

        /* Reset margin for sections inside the wrapper */
        .split-section-wrapper .text-section {
            margin: 0;
            height: 100%;
        }

        /* Join Steps */
        .join-step {
            display: flex;
            gap: 15px;
            margin-bottom: 1.5rem;
            align-items: flex-start;
        }

        .join-step:last-child {
            margin-bottom: 0;
        }

        .join-icon-box {
            flex-shrink: 0;
            width: 50px;
            height: 50px;
            background: #000;
            border: 2px solid var(--victory-gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: var(--victory-gold);
            box-shadow: 0 0 10px rgba(255, 204, 0, 0.3);
        }

        .join-text h4 {
            margin: 0 0 5px 0;
            color: #fff;
            font-family: 'Audiowide';
            font-size: 1.1rem;
        }

        .join-text p {
            margin: 0;
            font-size: 1rem;
            /* Validated */
            color: #ccc;
            line-height: 1.5;
        }

        /* Rules List */
        .rule-item {
            margin-bottom: 1.2rem;
            border-bottom: 1px dashed #444;
            padding-bottom: 1rem;
        }

        .rule-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .rule-head {
            display: block;
            color: var(--fire-red);
            font-weight: bold;
            margin-bottom: 0.3rem;
            font-size: 1.05rem;
        }

        .rule-head i {
            margin-right: 8px;
        }

        .rule-body {
            font-size: 1rem;
            /* Validated */
            color: #ddd;
        }

        /* ORGANIZER STYLES */
        .organizer-profile {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .organizer-img-box {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid var(--victory-gold);
            box-shadow: 0 0 15px var(--fire-red);
            margin: 0 auto;
        }

        .organizer-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .organizer-info h4 {
            font-size: 1.4rem;
            color: var(--victory-gold);
            margin: 0 0 5px;
            text-align: center;
        }

        .organizer-info .en-name {
            font-size: 1rem;
            /* Validated */
            font-family: 'Audiowide';
            color: #ccc;
        }

        .org-role {
            text-align: center;
            color: #aaa;
            font-size: 1rem;
            /* Validated */
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }

        .org-sub-head {
            color: var(--fire-red);
            font-weight: bold;
            margin-top: 1.2rem;
            margin-bottom: 0.5rem;
            border-left: 3px solid var(--victory-gold);
            padding-left: 10px;
        }

        @media (min-width: 768px) {
            .organizer-profile {
                flex-direction: row;
                align-items: flex-start;
            }

            .organizer-img-box {
                flex: 0 0 150px;
                margin: 0;
            }

            .organizer-info {
                flex: 1;
            }

            .organizer-info h4,
            .org-role {
                text-align: left;
            }
        }

        /* アクセスマップ用のスタイル */
        .access-content-wrapper {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .access-map iframe {
            width: 100%;
            height: 300px;
            border-radius: 8px;
            border: 1px solid var(--fire-red);
            /* Warm dark map filter */
            filter: invert(90%) sepia(20%) hue-rotate(330deg) contrast(0.9);
        }

        @media (min-width: 768px) {
            .access-content-wrapper {
                flex-direction: row;
                align-items: flex-start;
                text-align: left;
            }

            .access-text {
                flex: 1;
            }

            .access-map {
                flex: 1;
            }
        }

        /* =========================================
           ILLUSTRATION 2-COLUMN LAYOUT (ADDED)
           ========================================= */
        .section-with-illustration {
            display: flex;
            flex-direction: column;
            gap: 2rem;
            align-items: center;
        }

        .section-text-content {
            flex: 1;
            width: 100%;
        }

        .section-illustration {
            width: 90%;
            max-width: 400px;
            border: 4px solid #222;
            border-radius: 8px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.6);
            transform: rotate(2deg);
            transition: transform 0.3s;
        }

        .section-illustration:hover {
            transform: rotate(-2deg) scale(1.05);
            border-color: var(--victory-gold);
        }

        @media (min-width: 768px) {
            .section-with-illustration.right-img {
                flex-direction: row;
            }

            .section-with-illustration.left-img {
                flex-direction: row-reverse;
            }

            .section-illustration {
                width: 45%;
            }

            .section-text-content {
                width: 55%;
            }
        }

        /* =========================================
           RELATED SITES (ALLIANCE) STYLES
           ========================================= */
        .related-grid {
            display: flex;
            justify-content: center;
            /* Center items mainly for single item or few items */
            flex-wrap: wrap;
            gap: 2rem;
            margin-top: 1.5rem;
        }

        .related-card {
            display: block;
            width: 280px;
            background: #111;
            border: 2px solid #555;
            border-radius: 8px;
            overflow: hidden;
            text-decoration: none;
            transition: 0.3s;
            position: relative;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }

        /* Interactive State (for active links) */
        .related-card.active:hover {
            transform: translateY(-5px);
            border-color: var(--victory-gold);
            box-shadow: 0 0 20px var(--fighter-orange);
        }

        /* Coming Soon State */
        .related-card.coming-soon {
            cursor: not-allowed;
            border-color: #444;
            opacity: 0.9;
        }

        .related-img-box {
            width: 100%;
            height: 160px;
            position: relative;
        }

        .related-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* Desaturate the image slightly if coming soon */
            filter: brightness(0.8) contrast(1.1);
        }

        .related-card.coming-soon .related-img {
            filter: grayscale(80%) brightness(0.6);
        }

        .related-info {
            padding: 12px;
            border-top: 1px solid #333;
            background: linear-gradient(180deg, #222, #111);
            text-align: center;
        }

        .related-name {
            color: var(--victory-gold);
            font-family: 'Audiowide', sans-serif;
            font-size: 1.1rem;
            margin: 0;
            letter-spacing: 1px;
        }

        /* Overlay Mask for Coming Soon */
        .cs-mask {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2;
        }

        .cs-stamp {
            color: #aaa;
            font-family: 'Audiowide', sans-serif;
            font-size: 1.5rem;
            border: 3px solid #aaa;
            padding: 8px 20px;
            transform: rotate(-10deg);
            letter-spacing: 2px;
            text-shadow: 0 2px 4px #000;
            background: rgba(0, 0, 0, 0.5);
            white-space: nowrap;
        }

        /* =========================================
           OPERATING COMPANY STYLES
           ========================================= */
        .company-content-wrapper {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            align-items: center;
        }

        .company-logo-box {
            width: 100%;
            max-width: 300px;
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid var(--victory-gold);
            border-radius: 8px;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 10px rgba(255, 204, 0, 0.3);
            /* Aspect Ratio: 4:3 (Landscape-ish) to 1:1 */
            aspect-ratio: 4 / 3;
        }

        .company-logo {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .company-info {
            width: 100%;
            text-align: left;
        }

        /* NEW: Dedicated table styles for Company to ensure readability */
        .company-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 1rem;
            font-size: 1.1rem;
            /* Large enough */
        }

        .company-table th,
        .company-table td {
            padding: 10px 5px;
            border-bottom: 1px solid #444;
            text-align: left;
            vertical-align: top;
            line-height: 1.5;
        }

        .company-table th {
            color: var(--victory-gold);
            width: 25%;
            font-weight: normal;
            white-space: nowrap;
        }

        .company-table td {
            color: #fff;
            font-weight: 700;
            /* Bold for readability */
        }

        .company-desc {
            margin-top: 1rem;
            color: #eee;
            /* Brighter than #ccc */
            line-height: 1.8;
            font-size: 1rem;
            /* Validated */
            border-top: 1px dashed #555;
            padding-top: 1rem;
        }

        @media (min-width: 768px) {
            .company-content-wrapper {
                flex-direction: row;
                align-items: flex-start;
            }

            .company-logo-box {
                flex: 0 0 250px;
            }

            .company-info {
                flex: 1;
            }
        }

        /* Mobile Optimization for Company Table */
        @media (max-width: 600px) {
            .company-table th {
                display: block;
                width: 100%;
                border-bottom: none;
                padding-bottom: 0;
                font-size: 1rem;
                /* Validated */
                opacity: 0.9;
            }

            .company-table td {
                display: block;
                padding-top: 2px;
                padding-left: 0;
            }

            /* Prevent banner text from overlapping or breaking weirdly on small screens */
            .schedule-main {
                /* Removed clamp to avoid confusion, let it scale naturally or wrap */
                font-size: 2rem;
            }

            /* Force sub text to stay on one line and scale down if needed */
            .schedule-sub {
                white-space: normal;
                font-size: 1.8rem;
            }
        }

        /* Floating Action Button */
        .fab-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--victory-gold);
            color: #000;
            padding: 15px 25px;
            border-radius: 50px;
            font-weight: bold;
            text-decoration: none;
            box-shadow: 0 0 15px var(--fire-red);
            border: 2px solid #fff;
            z-index: 1000;
            font-family: 'Zen Kaku Gothic New', sans-serif;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: transform 0.2s, background 0.3s;
            animation: pulse 2s infinite;
            font-size: 1rem;
            white-space: nowrap;
        }

        .fab-btn:hover {
            transform: scale(1.05);
            background: #fff;
        }

        .fab-btn i {
            font-size: 1.4rem;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(230, 0, 18, 0.7);
            }

            70% {
                box-shadow: 0 0 0 15px rgba(230, 0, 18, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(230, 0, 18, 0);
            }
        }

        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            z-index: 999;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            padding: 1rem;
            transition: opacity 0.3s, visibility 0.3s;
        }

        .modal.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-win {
            background: linear-gradient(135deg, #222, #000);
            border: 2px solid var(--victory-gold);
            border-radius: 8px;
            padding: 20px;
            max-width: 600px;
            width: 100%;
            text-align: center;
            box-shadow: 0 0 30px var(--fire-red);
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            position: relative;
            transform: scaleX(0.01) scaleY(0);
            opacity: 0;
        }

        .modal.active .modal-win {
            animation: tvOn 0.4s cubic-bezier(0.23, 1, 0.32, 1) forwards;
            animation-delay: 0.1s;
        }

        @keyframes tvOn {
            0% {
                transform: scaleX(0.01) scaleY(0);
                opacity: 1;
            }

            50% {
                transform: scaleX(1) scaleY(0.01);
                opacity: 1;
            }

            100% {
                transform: scaleX(1) scaleY(1);
                opacity: 1;
            }
        }

        .modal-img {
            max-width: 100%;
            max-height: 50vh;
            border-radius: 4px;
            border: 1px solid #fff;
            object-fit: contain;
            margin: 0 auto;
            background: #000;
        }

        @media (max-width: 600px) {
            .container {
                padding: 1.5rem 1rem;
            }

            h1 {
                font-size: 2.2rem;
            }

            .modal-win {
                padding: 15px;
                width: 95%;
            }

            .gallery-grid {
                /* スマホでは1個ずつ縦積みにする */
                grid-template-columns: 1fr;
            }

            /* Banner Font Adjustment for Mobile */
            .banner-title {
                font-size: 1.1rem;
            }

            .banner-sub {
                font-size: 1rem;
            }

            .fab-btn {
                bottom: 15px;
                right: 15px;
                padding: 12px 20px;
                font-size: 0.95rem;
            }
        }

        /* =========================================
           MOBILE OPTIMIZATION (ADDED)
           ========================================= */
        @media (max-width: 768px) {

            /* 1. Container Spacing */
            .container {
                padding: 2rem 15px;
                /* Reduce side padding */
                width: auto;
                margin: 0 10px;
            }

            /* 2. Headings */
            h1 {
                font-size: 2rem;
            }

            .text-section h3,
            h2 {
                font-size: 1.2rem !important;
                word-break: keep-all;
                overflow-wrap: normal;
                line-height: 1.4;
                text-align: left;
            }

            /* 3. Section Spacing */
            .text-section {
                margin: 4rem 0;
                /* Maintain spacing */
            }

            /* Split Section Wrapper (Join & Rules) */
            .split-section-wrapper {
                display: flex;
                flex-direction: column;
                gap: 60px;
                /* Ensure spacing between JOIN and RULES */
            }

            /* 4. Timetable Layout: 2 Columns [Line | Content] where Content has Time stacked on Text */
            .timeline-item {
                grid-template-columns: 30px 1fr;
                gap: 15px;
            }

            .timeline-time {
                /* Move to right column, top row */
                grid-column: 2;
                grid-row: 1;
                text-align: left;
                padding-top: 0;
                margin-bottom: 5px;
                font-size: 1rem;
            }

            .timeline-line-area {
                /* Move to left column, span full height */
                grid-column: 1;
                grid-row: 1 / 3;
            }

            .timeline-content {
                /* Move to right column, bottom row */
                grid-column: 2;
                grid-row: 2;
                padding-bottom: 30px;
                /* Spacing between items */
            }

            .timeline-dot {
                top: 6px;
                /* Align with the Time text */
            }

            /* 5. System Table Optimization */
            .system-table th,
            .system-table td {
                display: block;
                width: 100%;
                box-sizing: border-box;
            }

            .system-table th {
                border-bottom: none;
                padding-bottom: 5px;
                color: var(--victory-gold);
                font-size: 1rem;
            }

            .system-table td {
                padding-top: 0;
                padding-left: 15px;
                /* Indent slightly */
                border-bottom: 1px solid #444;
                margin-bottom: 15px;
            }

            .system-table tr:last-child td {
                border-bottom: none;
            }
        }
    </style>
</head>

            }

            // 3. SCHEDULE (Insert AFTER Photo Gallery)
            if (config.schedule && config.schedule.dates) {
                const section = document.createElement('div');
                section.className = 'text-section schedule-mode';

                const today = new Date();
                today.setHours(0, 0, 0, 0);

                const upcomingDates = config.schedule.dates
                    .map(dStr => new Date(dStr))
                    .filter(d => !isNaN(d) && d >= today)
                    .sort((a, b) => a - b)
                    .slice(0, 6);

                let cardsHtml = '<div class="schedule-grid">';
                const monthNames = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
                const dayNames = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"];
                const dayClasses = ["sun", "mon", "tue", "wed", "thu", "fri", "sat"];

                if (upcomingDates.length > 0) {
                    upcomingDates.forEach((date, index) => {
                        const mName = monthNames[date.getMonth()];
                        const dt = date.getDate();
                        const dayIndex = date.getDay();
                        const dayStr = dayNames[dayIndex];
                        const dayClass = dayClasses[dayIndex];

                        cardsHtml += `
                            <div class="schedule-card scroll-reveal zoom-in" style="transition-delay: ${index * 0.1}s">
                                <div class="sc-month">${mName}</div>
                                <div class="sc-date">${dt}</div>
                                <div class="sc-day ${dayClass}">${dayStr}</div>
                            </div>
                        `;
                    });
                } else {
                    cardsHtml += `<div style="width:100%; text-align:center; padding:20px; color:#bbb;">現在調整中です...</div>`;
                }
                cardsHtml += '</div>';

                section.innerHTML = `
                    <h3 class="scroll-reveal from-left">${config.schedule.title}</h3>
                    <div class="schedule-regular-banner scroll-reveal zoom-in">
                        <span class="schedule-main">EVERY SATURDAY</span>
                        <span class="schedule-sub">${config.schedule.timeInfo}</span>
                        <div class="schedule-desc">
                            毎週土曜日：固定開催<br>日曜日：不定期開催
                        </div>
                    </div>
                    ${cardsHtml}
                    <p class="schedule-note scroll-reveal from-bottom">${config.schedule.note}</p>
                `;
                lastElement.after(section);
                lastElement = section;

                // 3.5 Insert Instagram Banner AFTER Schedule
                const instaSection = document.createElement('div');
                instaSection.innerHTML = `
                    <a href="https://www.instagram.com/takana_sumabura?igsh=MWU1bXBvbXh1Y3UxOA==" target="_blank"
                        class="challenger-banner scroll-reveal zoom-in" style="margin-top: 2rem;">
                        <span class="banner-title">最新の開催情報は<br class="sp-br">公式Instagramをチェック ▷</span>
                        <span class="banner-sub">@takana_sumabura</span>
                    </a>
                    <span class="banner-note">※ 初心者・お一人様も安心です！</span>
                `;
                lastElement.after(instaSection);
                lastElement = instaSection;
            }

            // 4. SYSTEM & MENU (Insert AFTER Schedule - prioritize price over rules)
            if (config.system && config.system.title && config.system.content) {
                const section = document.createElement('div');
                section.className = 'text-section system-mode';
                section.innerHTML = `
                    <h3 class="scroll-reveal from-left">${config.system.title}</h3>
                    <div class="section-with-illustration left-img">
                        <div class="section-text-content scroll-reveal from-bottom">
                            ${config.system.content}
                        </div>
                        <img src="./image/cat_new_5.png" class="section-illustration scroll-reveal zoom-in" style="transform: rotate(-2deg);" alt="Illustration">
                    </div>
                `;
                lastElement.after(section);
                lastElement = section;
            }

            // 4.5 FAQ (Insert AFTER System, BEFORE Join)
            if (config.faq && config.faq.items && config.faq.items.length > 0) {
                const section = document.createElement('div');
                section.className = 'text-section faq-mode';

                let faqHtml = '<div class="faq-container">';
                config.faq.items.forEach((item, index) => {
                    faqHtml += `
                        <div class="faq-item scroll-reveal from-bottom" style="transition-delay: ${index * 0.15}s">
                            <div class="faq-q">${item.q}</div>
                            <div class="faq-a">${item.a}</div>
                        </div>
                    `;
                });
                faqHtml += '</div>';

                section.innerHTML = `
                    <h3 class="scroll-reveal from-left">${config.faq.title}</h3>
                    <div class="section-with-illustration right-img">
                        <div class="section-text-content">
                            ${faqHtml}
                        </div>
                        <img src="./image/cat_sweat.png" class="section-illustration scroll-reveal zoom-in" style="margin-top: 1rem;" alt="Illustration">
                    </div>
                `;
                lastElement.after(section);
                lastElement = section;
            }

            // 5. JOIN & RULES (Insert AFTER System)
            if (config.join || config.rules) {
                const wrapper = document.createElement('div');
                wrapper.className = 'split-section-wrapper';

                if (config.join) {
                    const joinSection = document.createElement('div');
                    joinSection.className = 'text-section join-mode';

                    let stepsHtml = '';
                    config.join.steps.forEach((step, index) => {
                        stepsHtml += `
                            <div class="join-step scroll-reveal from-bottom" style="transition-delay: ${index * 0.15}s">
                                <div class="join-icon-box"><i class="${step.icon}"></i></div>
                                <div class="join-text">
                                    <h4>${step.title}</h4>
                                    <p>${step.desc}</p>
                                </div>
                            </div>
                        `;
                    });

                    joinSection.innerHTML = `
                        <h3 class="scroll-reveal from-left">${config.join.title}</h3>
                        <div class="join-content">${stepsHtml}</div>
                    `;
                    wrapper.appendChild(joinSection);
                }

                if (config.rules) {
                    const rulesSection = document.createElement('div');
                    rulesSection.className = 'text-section rules-mode';

                    let itemsHtml = '<div class="rules-list">';
                    config.rules.items.forEach((item, index) => {
                        itemsHtml += `
                            <div class="rule-item scroll-reveal from-bottom" style="transition-delay: ${index * 0.15}s">
                                <span class="rule-head"><i class="fa-solid fa-diamond"></i> ${item.head}</span>
                                <span class="rule-body">${item.body}</span>
                            </div>
                        `;
                    });
                    itemsHtml += '</div>';

                    rulesSection.innerHTML = `
                        <h3 class="scroll-reveal from-left">${config.rules.title}</h3>
                        ${itemsHtml}
                    `;
                    wrapper.appendChild(rulesSection);
                }

                lastElement.after(wrapper);
                lastElement = wrapper;
            }

            // 6. TIME TABLE (Insert AFTER Join/Rules)
            if (config.timetable && config.timetable.events) {
                const section = document.createElement('div');
                section.className = 'text-section timetable-mode';
                let timeHtml = '<div class="timeline-container">';
                config.timetable.events.forEach((item, index) => {
                    timeHtml += `
                        <div class="timeline-item scroll-reveal from-bottom" style="transition-delay: ${index * 0.1}s">
                            <div class="timeline-time">${item.time}</div>
                            <div class="timeline-line-area"><div class="timeline-line"><div class="timeline-dot"></div></div></div>
                            <div class="timeline-content">
                                <h4 class="timeline-title">${item.title}</h4>
                                <p class="timeline-desc">${item.desc}</p>
                            </div>
                        </div>
                    `;
                });
                timeHtml += '</div>';

                section.innerHTML = `
                    <h3 class="scroll-reveal from-left">${config.timetable.title}</h3>
                    ${timeHtml}
                `;
                lastElement.after(section);
                lastElement = section;
            }

            // 7. VOICES (Insert AFTER Time Table)
            if (config.voices && config.voices.items && config.voices.items.length > 0) {
                const section = document.createElement('div');
                section.className = 'text-section voices-mode';
                section.style.background = 'linear-gradient(180deg, rgba(30,0,0,0.8), rgba(0,0,0,0.8))';
                section.style.border = '1px solid var(--fire-red)';

                let voicesHtml = '<div class="voices-container" style="display: flex; flex-direction: column; gap: 1.5rem;">';
                config.voices.items.forEach((item, index) => {
                    voicesHtml += `
                        <div class="voice-card scroll-reveal from-bottom" style="transition-delay: ${index * 0.1}s; background: rgba(0,0,0,0.6); border-radius: 8px; padding: 1.5rem; border-left: 4px solid var(--victory-gold); box-shadow: 0 4px 10px rgba(0,0,0,0.5);">
                            <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 10px;">
                                <div style="width: 40px; height: 40px; border-radius: 50%; background: #333; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; color: var(--victory-gold);">
                                    <i class="${item.icon}"></i>
                                </div>
                                <div style="font-weight: bold; color: #fff; font-size: 1.1rem; font-family: 'Zen Kaku Gothic New', sans-serif;">${item.name}</div>
                            </div>
                            <p style="margin: 0; color: #ddd; line-height: 1.7; font-size: 0.95rem;">${item.text}</p>
                        </div>
                    `;
                });
                voicesHtml += '</div>';

                section.innerHTML = `
                    <h3 class="scroll-reveal from-left" style="color: #fff; text-shadow: 2px 2px 0 var(--fire-red);">${config.voices.title}</h3>
                    ${voicesHtml}
                `;
                lastElement.after(section);
                lastElement = section;
            }

            // 8. STAGE INFO (ACCESS) (Insert AFTER Spirit)
            if (config.access && config.access.title && config.access.content) {
                const section = document.createElement('div');
                section.className = 'text-section access-mode';

                const mapHtml = config.access.map ? `<div class="access-map scroll-reveal zoom-in" style="transition-delay: 0.2s">${config.access.map}</div>` : '';
                const imgHtml = config.access.img ? `<div class="access-photo scroll-reveal zoom-in" style="margin-top: 2rem; border-radius: 8px; overflow: hidden; border: 2px solid #333;"><img src="${config.access.img}" alt="Access Location" style="width: 100%; height: auto; display: block;"></div>` : '';

                section.innerHTML = `
                    <h3 class="scroll-reveal from-left">${config.access.title}</h3>
                    <div class="access-content-wrapper">
                        <div class="access-text scroll-reveal from-bottom">${config.access.content}</div>
                        ${mapHtml}
                    </div>
                    ${imgHtml}
                `;
                lastElement.after(section);
                lastElement = section;
            }

            // 9. ORGANIZER (Insert AFTER Stage Info)
            if (config.organizer) {
                const section = document.createElement('div');
                section.className = 'text-section organizer-mode';

                section.innerHTML = `
                    <h3 class="scroll-reveal from-left">${config.organizer.title}</h3>
                    <div class="organizer-profile scroll-reveal from-bottom">
                        <div class="organizer-img-box">
                            <img src="${config.organizer.img}" alt="${config.organizer.enName}" class="organizer-img">
                        </div>
                        <div class="organizer-info">
                            <h4>${config.organizer.name} <span class="en-name">(${config.organizer.enName})</span></h4>
                            <div class="org-role">${config.organizer.role}</div>
                            
                            <div class="org-sub-head">[経歴]</div>
                            <p>${config.organizer.history}</p>
                            
                            <div class="org-sub-head">[スマブラ部への想い]</div>
                            <p>${config.organizer.message}</p>
                        </div>
                    </div>
                `;
                lastElement.after(section);
                lastElement = section;
            }
            /*
            // 10. OPERATING COMPANY (Insert AFTER Organizer)
            if (config.company) {
                const section = document.createElement('div');
                section.className = 'text-section company-mode';
                
                section.innerHTML = `
                    <h3 class="scroll-reveal from-left">${config.company.title}</h3>
                    <div class="company-content-wrapper scroll-reveal from-bottom">
                        <div class="company-logo-box">
                           <img src="${config.company.logo}" alt="${config.company.name}" class="company-logo">
                        </div>
                        <div class="company-info">
                           <table class="company-table">
                               <tr><th>会社名</th><td>${config.company.name}</td></tr>
                               <tr><th>代表</th><td>${config.company.rep}</td></tr>
                               <tr><th>所在地</th><td>${config.company.address}</td></tr>
                           </table>
                           <div class="company-desc">${config.company.desc}</div>
                        </div>
                    </div>
                `;
                lastElement.after(section);
                lastElement = section;
            }
            */

            // Gallery (Activities) Card Logic - Changed to Alternating 2-Column Rows
            const grid = document.getElementById('gallery-grid');
            // Remove the grid display block, just stack the sections vertically
            grid.style.display = 'block';
            grid.className = ''; // Remove grid styles

            const maxItems = 4;

            for (let i = 1; i <= maxItems; i++) {
                const workConfig = config.works[i - 1] || {};

                let imgPath;
                if (workConfig.file && workConfig.file.startsWith('http')) {
                    imgPath = workConfig.file;
                } else if (workConfig.file) {
                    imgPath = `./image/${workConfig.file}`;
                } else {
                    imgPath = `./image/image${i}.jpg`;
                }

                const title = workConfig.title ? workConfig.title : `Work ${i}`;
                const category = workConfig.category ? workConfig.category : 'Gallery';

                const layoutClass = i % 2 === 0 ? 'left-img' : 'right-img';

                const div = document.createElement('div');
                div.className = 'scroll-reveal from-bottom';
                div.style.marginBottom = '3rem';
                div.style.background = 'rgba(0, 0, 0, 0.4)';
                div.style.border = '1px solid #333';
                div.style.borderRadius = '12px';
                div.style.padding = '2rem 1rem';
                div.style.boxShadow = '0 4px 15px rgba(0,0,0,0.5)';

                div.innerHTML = `
                    <div class="section-with-illustration ${layoutClass}">
                        <div class="section-text-content" style="text-align: left;">
                            <h4 style="margin: 0 0 15px 0; font-family: 'Zen Kaku Gothic New', sans-serif; font-size: 1.5rem; color: var(--victory-gold); border-left: 5px solid var(--fire-red); padding-left: 15px; font-weight: 900;">
                                ${title}
                            </h4>
                            <p style="margin: 0; color: #eee; font-size: 1.05rem; line-height: 1.8;">
                                ${category}
                            </p>
                        </div>
                        <img src="${imgPath}" class="section-illustration" alt="${title}" style="transform: rotate(${i % 2 === 0 ? '-2deg' : '2deg'});">
                    </div>
                `;

                grid.appendChild(div);
            }

            // Add CLOSING Message before the footer
            const footerArea = document.getElementById('footer-area');
            if (config.closing && config.closing.title) {
                const closingSection = document.createElement('div');
                closingSection.className = 'text-section closing-mode';
                closingSection.style.background = 'linear-gradient(135deg, var(--fire-red), #330000)';
                closingSection.style.border = '2px solid var(--victory-gold)';
                closingSection.style.textAlign = 'center';
                closingSection.style.padding = '3rem 1.5rem';
                closingSection.style.boxShadow = '0 10px 30px rgba(230,0,18,0.3)';

                closingSection.innerHTML = `
                    <h3 class="scroll-reveal from-bottom" style="border: none; display: block; margin-bottom: 1.5rem; text-shadow: 2px 2px 4px #000; font-size: 1.8rem; text-align: center !important;">${config.closing.title}</h3>
                    <p class="scroll-reveal from-bottom" style="transition-delay: 0.1s; font-size: 1.1rem; margin-bottom: 2rem; text-shadow: 1px 1px 2px #000; text-align: center !important;">${config.closing.message}</p>
                    <a href="${config.closing.btnUrl}" target="_blank" class="fab-btn scroll-reveal zoom-in" style="transition-delay: 0.2s; position: static; display: inline-block; transform: none; box-shadow: 0 5px 15px rgba(0,0,0,0.8); width: 100%; max-width: 400px; padding: 15px 15px; font-size: 1.1rem; border: 2px solid #fff; box-sizing: border-box; white-space: normal; line-height: 1.4;">
                       <i class="fa-brands fa-line"></i> ${config.closing.btnText}
                    </a>
                `;
                footerArea.parentNode.insertBefore(closingSection, footerArea);
            }

            // Init Scroll Observer
            initScrollObserver();
        });

        // SCROLL OBSERVER LOGIC
        function initScrollObserver() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('reveal-active');
                        observer.unobserve(entry.target); // Animate only once
                    }
                });
            }, {
                root: null,
                // Changed from -15% to -30% to trigger animation later (when element is more visible)
                rootMargin: '0px 0px -10% 0px',
                threshold: 0
            });

            const targets = document.querySelectorAll('.scroll-reveal');
            targets.forEach(target => observer.observe(target));
        }

        const modal = document.getElementById('modal');

        function openModal(work, imgPath) {
            document.getElementById('modal-img').src = imgPath;
            document.getElementById('modal-title').textContent = work.title;
            document.getElementById('modal-cat').textContent = `${work.category}`;

            modal.classList.remove('active');
            void modal.offsetWidth;
            modal.classList.add('active');
        }

        function closeModal() {
            modal.classList.remove('active');
        }
    </script>
</body>

</html>
