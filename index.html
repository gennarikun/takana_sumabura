        /* 左からスライドイン（見出し等） */
        .scroll-reveal.from-left {
            transform: translateX(-50px);
        }
        /* ズームイン（画像やカード等） */
        .scroll-reveal.zoom-in {
            transform: scale(0.9);
        }
        
        /* アクティブ状態（表示） */

            opacity: 1;
            transform: translate(0, 0) scale(1) !important;

        /* =========================================
           MOBILE OPTIMIZATION (ADDED)
           ========================================= */

                padding: 2rem 15px; /* Reduce side padding */

                grid-column: 2;
                grid-row: 1;

                top: 6px; /* Align with the Time text */

            .system-table th, .system-table td {
                display: block;

                border-bottom: none;

                padding-top: 0;

                border-bottom: 1px solid #444;
                margin-bottom: 15px;
            }
            .system-table tr:last-child td {
                border-bottom: none;
            }
        }
    </style>
</head>

                section.innerHTML = `
                    <h3 class="scroll-reveal from-left">${config.related.title}</h3>
                    ${cardsHtml}
                `;
                lastElement.after(section);
                lastElement = section;
            }
            */
            // 9. ORGANIZER (Insert AFTER Related Sites) [NEW]
            if (config.organizer) {
                const section = document.createElement('div');
                section.className = 'text-section organizer-mode';
                
                section.innerHTML = `
                    <h3 class="scroll-reveal from-left">${config.organizer.title}</h3>
                    <div class="organizer-profile scroll-reveal from-bottom">
                        <div class="organizer-img-box">
                            <img src="${config.organizer.img}" alt="${config.organizer.enName}" class="organizer-img">
                        </div>
                        <div class="organizer-info">
                            <h4>${config.organizer.name} <span class="en-name">(${config.organizer.enName})</span></h4>
                            <div class="org-role">${config.organizer.role}</div>
                            
                            <div class="org-sub-head">[経歴]</div>
                            <p>${config.organizer.history}</p>
                            
                            <div class="org-sub-head">[スマブラ部への想い]</div>
                            <p>${config.organizer.message}</p>
                        </div>
                    </div>
                `;
                lastElement.after(section);
                lastElement = section;
            }
            /*
            // 10. OPERATING COMPANY (Insert AFTER Organizer)
            if (config.company) {
                const section = document.createElement('div');
                section.className = 'text-section company-mode';
                
                section.innerHTML = `
                    <h3 class="scroll-reveal from-left">${config.company.title}</h3>
                    <div class="company-content-wrapper scroll-reveal from-bottom">
                        <div class="company-logo-box">
                           <img src="${config.company.logo}" alt="${config.company.name}" class="company-logo">
                        </div>
                        <div class="company-info">
                           <table class="company-table">
                               <tr><th>会社名</th><td>${config.company.name}</td></tr>
                               <tr><th>代表</th><td>${config.company.rep}</td></tr>
                               <tr><th>所在地</th><td>${config.company.address}</td></tr>
                           </table>
                           <div class="company-desc">${config.company.desc}</div>
                        </div>
                    </div>
                `;
                lastElement.after(section);
                lastElement = section;
            }
            */

            // Gallery Grid Logic
            const grid = document.getElementById('gallery-grid');
            const maxItems = 4;

            for (let i = 1; i <= maxItems; i++) {
                const workConfig = config.works[i - 1] || {};
                
                let imgPath;
                if (workConfig.file && workConfig.file.startsWith('http')) {
                    imgPath = workConfig.file;
                  } else if (workConfig.file) {
                    imgPath = `./image/${workConfig.file}`;
                } else {
                    imgPath = `./image/image${i}.jpg`;
                }
                
                const title = workConfig.title ? workConfig.title : `Work ${i}`;
                const category = workConfig.category ? workConfig.category : 'Gallery';

                const div = document.createElement('div');
                // Removed scroll-reveal class to ensure visibility
                div.className = 'work-item'; 
                // Add minor stagger effect for grid items to look cool
                div.style.transitionDelay = `${(i % 2) * 0.1}s`;

                // div.style.display = 'none'; // Removed initial display none to prevent flicker with fast loading URLs
                
                div.innerHTML = `
                    <img src="${imgPath}" class="work-img" alt="${title}" 
                         onerror="this.style.display='none'">
                    <div class="work-title-overlay">${title}</div>
                `;
                
                div.onclick = () => openModal({ title, category }, imgPath);
                grid.appendChild(div);
            }

            const linkList = document.getElementById('links-list');
            config.links.forEach(link => {
                if(!link.label) return;
                const a = document.createElement('a');
                a.href = link.url;
                a.className = 'y2k-btn scroll-reveal from-bottom';
                a.textContent = link.label;
                a.target = "_blank";
                a.rel = "noopener noreferrer";
                linkList.appendChild(a);
            });

            // Init Scroll Observer
            initScrollObserver();
        });

        // SCROLL OBSERVER LOGIC
        function initScrollObserver() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('reveal-active');
                        observer.unobserve(entry.target); // Animate only once
                    }
                });
            }, {
                root: null,
                // Changed from -15% to -30% to trigger animation later (when element is more visible)
                rootMargin: '0px 0px -10% 0px', 
                threshold: 0
            });

            const targets = document.querySelectorAll('.scroll-reveal');
            targets.forEach(target => observer.observe(target));
        }

        const modal = document.getElementById('modal');
        
        function openModal(work, imgPath) {
            document.getElementById('modal-img').src = imgPath;
            document.getElementById('modal-title').textContent = work.title;
            document.getElementById('modal-cat').textContent = `${work.category}`;
            
            modal.classList.remove('active');
            void modal.offsetWidth; 
            modal.classList.add('active');
        }

        function closeModal() {
            modal.classList.remove('active');
        }
    </script>
